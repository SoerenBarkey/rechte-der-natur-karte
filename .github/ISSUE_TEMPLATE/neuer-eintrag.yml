```yaml
name: Neuer Eintrag
description: Einen neuen Eintrag für die Datensammlung vorschlagen
title: "[Neuer Eintrag] "
labels:
  - neuer-eintrag

body:

  - type: markdown
    attributes:
      value: |
        ## Neuer Eintrag

        Bitte fülle die folgenden Felder aus.

        Die Angaben werden anschließend geprüft und in die Datensammlung übernommen.

  - type: input
    id: id
    attributes:
      label: ID
      description: Eine kurze, eindeutige ID für den Eintrag, z. B. "isar". Bitte hier die Kleinschreibung beachten.
      placeholder: "isar"
    validations:
      required: true

  - type: input
    id: name
    attributes:
      label: Name
      description: Der Name des Flusses, Projekts, Vereins etc.
      placeholder: "Isar"
    validations:
      required: true

  - type: input
    id: ort
    attributes:
      label: Ort oder Koordinaten
      description: Gib entweder einen Ort an, z. B. "München", oder direkt Breitengrad und Längengrad im Format "47.375556, 11.408056".
      placeholder: "München"
    validations:
      required: true

  - type: checkboxes
    id: kategorie
    attributes:
      label: Kategorie
      description: Bitte wähle eine oder mehrere passende Kategorien.
      options:
        - label: Flüsse
        - label: Wald
        - label: Meere & Seen
        - label: Gesetzesentwürfe
        - label: Gesetz
        - label: Kunst & Kultur
        - label: Literatur
        - label: Vereine, Stiftungen & NGOs
        - label: Wissenschaft
        - label: Rechtsexpert:innen
        - label: Zivilgesellschaft
    validations:
      required: true

  - type: dropdown
    id: status
    attributes:
      label: Status
      description: Bitte wähle den aktuellen Status des Eintrags. Wenn nichts passt, wähle bitte "Initiative".
      options:
        - Initiative
        - Gesetzesentwurf
        - Gesetz
    validations:
      required: true

  - type: input
    id: land
    attributes:
      label: Land
      description: In welchem Land befindet sich der Eintrag?
      placeholder: "Deutschland"
    validations:
      required: true

  - type: textarea
    id: beschreibung
    attributes:
      label: Beschreibung
      description: Eine kurze Beschreibung des Eintrags.
      placeholder: |
        Hier kannst du die Beschreibung eingeben ...
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: Webseite
      description: Falls vorhanden, die URL zur Webseite des Eintrags.
      placeholder: "https://example.org"
    validations:
      required: false

  - type: input
    id: tags
    attributes:
      label: Tags
      description: Mehrere Tags bitte durch Kommata trennen.
      placeholder: "Fluss, Bayern"
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        Vielen Dank! Nach dem Absenden wird der Eintrag geprüft und anschließend in die Datensammlung übernommen.
```
