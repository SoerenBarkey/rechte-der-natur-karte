name: JSON-Vorschlag aus Issue

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  create-json-preview:
    runs-on: ubuntu-latest

    steps:
      - name: Formularantworten auslesen
        id: form
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body || "";

            function getField(label) {
              const regex = new RegExp(
                `### ${label}\\s*\\n\\n([\\s\\S]*?)(?=\\n### |$)`
              );
              const match = body.match(regex);
              return match ? match[1].trim() : "";
            }

            function clean(value) {
              if (!value || value === "_No response_") {
                return "";
              }
              return value;
            }

            const data = {
              id: clean(getField("ID")),
              name: clean(getField("Name")),
              ort: clean(getField("Ort oder Koordinaten")),
              kategorie: clean(getField("Kategorie")),
              status: clean(getField("Status")),
              land: clean(getField("Land")),
              beschreibung: clean(getField("Beschreibung")),
              url: clean(getField("Webseite")),
              tags: clean(getField("Tags"))
            };

            core.setOutput("json", JSON.stringify(data, null, 2));

      - name: JSON-Vorschlag als Kommentar posten
        uses: actions/github-script@v7
        env:
          JSON_DATA: ${{ steps.form.outputs.json }}
        with:
          script: |
            const json = process.env.JSON_DATA;

            const comment = [
              "## JSON-Vorschlag",
              "",
              "Bitte prüfe die Angaben, bevor der Eintrag in die Datensammlung übernommen wird, insbesondere die automatisch erstellten Geo-Koordinaten.",
              "",
              "```json",
              json,
              "```"
            ].join("\n");

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment
            });
