name: Geprüften Eintrag übernehmen

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  import-entry:
    if: github.event.label.name == 'bereit-zur-uebernahme'

    runs-on: ubuntu-latest

    steps:

      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: JSON-Vorschlag aus Issue auslesen
        id: issue-data
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body || "";

            function getField(label) {
              const regex = new RegExp(
                `### ${label}\\s*\\n\\n([\\s\\S]*?)(?=\\n### |$)`
              );

              const match = body.match(regex);

              if (!match) {
                return "";
              }

              const value = match[1].trim();

              return value === "_No response_" ? "" : value;
            }

            function getCheckboxes(label) {
              const value = getField(label);

              if (!value) {
                return [];
              }

              return value
                .split("\n")
                .filter(line => line.startsWith("- [x]"))
                .map(line => line.replace("- [x]", "").trim());
            }

            function getTags(label) {
              const value = getField(label);

              if (!value) {
                return [];
              }

              return value
                .split(",")
                .map(tag => tag.trim())
                .filter(Boolean);
            }

            const categoryMap = {
              "Flüsse": "fluss",
              "Wald": "wald",
              "Meere & Seen": "meer",
              "Gesetzesentwürfe": "gesetzentwurf",
              "Kunst & Kultur": "kunst",
              "Literatur": "literatur",
              "Vereine, Stiftungen & NGOs": "vereine",
              "Wissenschaft": "wissenschaft",
              "Rechtsexpert:innen": "recht",
              "Zivilgesellschaft": "zivil"
            };

            const statusMap = {
              "Initiative": "initiative",
              "Gesetzesentwurf": "gesetzentwurf",
              "Gesetz": "gesetz"
            };

            const categories = getCheckboxes("Kategorie");

            const mappedCategories = categories
              .map(category => categoryMap[category])
              .filter(Boolean);

            const status = getField("Status");

            const data = {
              id: getField("ID"),
              name: getField("Name"),
              lat: null,
              lng: null,
              kategorie: mappedCategories,
              status: statusMap[status] || "",
              land: getField("Land"),
              beschreibung: getField("Beschreibung"),
              links: [],
              tags: getTags("Tags")
            };

            const url = getField("Webseite");

            if (url) {
              data.links.push({
                label: "Webseite",
                url: url
              });
            }

            const ort = getField("Ort oder Koordinaten");

            const coordinateMatch = ort.match(
              /^\s*(-?\d+(?:[.,]\d+)?)\s*[,;]\s*(-?\d+(?:[.,]\d+)?)\s*$/
            );

            if (!coordinateMatch) {
              core.setFailed(
                "Keine gültigen Koordinaten gefunden."
              );
              return;
            }

            data.lat = Number(
              coordinateMatch[1].replace(",", ".")
            );

            data.lng = Number(
              coordinateMatch[2].replace(",", ".")
            );

            core.setOutput(
              "json",
              JSON.stringify(data)
            );

      - name: Eintrag validieren und in projekte.json übernehmen
        env:
          JSON_DATA: ${{ steps.issue-data.outputs.json }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          path = "projekte.json"

          with open(path, "r", encoding="utf-8") as f:
              projects = json.load(f)

          new_entry = json.loads(os.environ["JSON_DATA"])

          errors = []

          # Pflichtfelder
          required = [
              "id",
              "name",
              "kategorie",
              "status",
              "land",
              "beschreibung"
          ]

          for field in required:
              if not new_entry.get(field):
                  errors.append(
                      f"Pflichtfeld '{field}' fehlt."
                  )

          # ID
          new_id = new_entry.get("id", "")

          if new_id and any(
              project.get("id") == new_id
              for project in projects
          ):
              errors.append(
                  f"Die ID '{new_id}' existiert bereits."
              )

          # Koordinaten
          if not isinstance(new_entry.get("lat"), (int, float)):
              errors.append("Breitengrad ist keine Zahl.")

          if not isinstance(new_entry.get("lng"), (int, float)):
              errors.append("Längengrad ist keine Zahl.")

          # Kategorien
          allowed_categories = {
              "fluss",
              "wald",
              "meer",
              "gesetzentwurf",
              "kunst",
              "literatur",
              "vereine",
              "wissenschaft",
              "recht",
              "zivil"
          }

          categories = new_entry.get("kategorie", [])

          if not isinstance(categories, list):
              errors.append(
                  "Kategorie muss eine Liste sein."
              )
          else:
              invalid = [
                  category
                  for category in categories
                  if category not in allowed_categories
              ]

              if invalid:
                  errors.append(
                      "Ungültige Kategorie: "
                      + ", ".join(invalid)
                  )

          # Status
          allowed_statuses = {
              "initiative",
              "gesetzentwurf",
              "gesetz"
          }

          if new_entry.get("status") not in allowed_statuses:
              errors.append(
                  "Ungültiger Status."
              )

          # Links
          if not isinstance(new_entry.get("links"), list):
              errors.append(
                  "Links muss eine Liste sein."
              )

          # Tags
          if not isinstance(new_entry.get("tags"), list):
              errors.append(
                  "Tags muss eine Liste sein."
              )

          if errors:
              print("Validierung fehlgeschlagen:")
              for error in errors:
                  print(f"- {error}")

              sys.exit(1)

          projects.append(new_entry)

          # Testen, ob das komplette Ergebnis gültiges JSON ist.
          json.dumps(
              projects,
              ensure_ascii=False
          )

          with open(path, "w", encoding="utf-8") as f:
              json.dump(
                  projects,
                  f,
                  ensure_ascii=False,
                  indent=2
              )
              f.write("\n")

          print(
              f"Eintrag '{new_id}' wurde erfolgreich "
              "validiert und hinzugefügt."
          )
          PY

      - name: Branch erstellen und Änderungen committen
        id: branch
        run: |
          BRANCH="add-issue-${{ github.event.issue.number }}-${{ github.run_id }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"

          git add projekte.json

          git commit \
            -m "Add entry from issue #${{ github.event.issue.number }}"

          git push origin "$BRANCH"

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Pull Request erstellen
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_URL=$(gh pr create \
            --title "Eintrag aus Issue #${{ github.event.issue.number }}" \
            --body "Automatisch erzeugt aus #${{ github.event.issue.number }}." \
            --base main \
            --head "${{ steps.branch.outputs.branch }}")

          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Pull Request automatisch mergen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge \
            "${{ steps.pr.outputs.url }}" \
            --merge \
            --delete-branch

      - name: Issue als übernommen markieren
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue edit \
            "${{ github.event.issue.number }}" \
            --remove-label "bereit-zur-uebernahme" \
            --add-label "übernommen"

          gh issue comment \
            "${{ github.event.issue.number }}" \
            --body "Der Eintrag wurde erfolgreich validiert und automatisch in \`projekte.json\` übernommen."
