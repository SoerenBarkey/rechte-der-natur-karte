name: Geprüften Eintrag übernehmen

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  import-entry:
    if: github.event.label.name == 'bereit-zur-uebernahme'

    runs-on: ubuntu-latest

    steps:

      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: JSON-Vorschlag aus Issue-Kommentar lesen
        id: issue-data
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;

            // Alle Kommentare des Issues abrufen
            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                per_page: 100
              }
            );

            // Nach dem Kommentar suchen, der unseren JSON-Vorschlag enthält.
            const jsonComment = comments
              .reverse()
              .find(comment =>
                comment.body &&
                comment.body.includes("JSON-Vorschlag")
              );

            if (!jsonComment) {
              core.setFailed(
                "Kein JSON-Vorschlag-Kommentar gefunden."
              );
              return;
            }

            const body = jsonComment.body;

            // JSON-Codeblock aus dem Kommentar extrahieren.
            const match = body.match(
              /```json\s*([\s\S]*?)\s*```/
            );

            if (!match) {
              core.setFailed(
                "Im JSON-Vorschlag wurde kein JSON-Codeblock gefunden."
              );
              return;
            }

            const jsonText = match[1].trim();

            let data;

            try {
              data = JSON.parse(jsonText);
            } catch (error) {
              core.setFailed(
                "Der JSON-Vorschlag ist nicht gültiges JSON: " +
                error.message
              );
              return;
            }

            core.info(
              "JSON-Vorschlag erfolgreich aus dem Issue gelesen."
            );

            core.setOutput(
              "json",
              JSON.stringify(data)
            );

      - name: JSON validieren und in projekte.json übernehmen
        env:
          JSON_DATA: ${{ steps.issue-data.outputs.json }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          path = "projekte.json"

          # Bestehende Daten laden
          with open(path, "r", encoding="utf-8") as f:
              projects = json.load(f)

          new_entry = json.loads(
              os.environ["JSON_DATA"]
          )

          errors = []

          # Pflichtfelder
          required = [
              "id",
              "name",
              "kategorie",
              "status",
              "land",
              "beschreibung"
          ]

          for field in required:
              if not new_entry.get(field):
                  errors.append(
                      f"Pflichtfeld '{field}' fehlt."
                  )

          # ID
          new_id = new_entry.get("id", "")

          if new_id and any(
              project.get("id") == new_id
              for project in projects
          ):
              errors.append(
                  f"Die ID '{new_id}' existiert bereits."
              )

          # Koordinaten
          if not isinstance(
              new_entry.get("lat"),
              (int, float)
          ):
              errors.append(
                  "Breitengrad ist keine Zahl."
              )

          if not isinstance(
              new_entry.get("lng"),
              (int, float)
          ):
              errors.append(
                  "Längengrad ist keine Zahl."
              )

          # Kategorien
          allowed_categories = {
              "fluss",
              "wald",
              "meer",
              "gesetzentwurf",
              "kunst",
              "literatur",
              "vereine",
              "wissenschaft",
              "recht",
              "zivil"
          }

          categories = new_entry.get("kategorie")

          if not isinstance(categories, list):
              errors.append(
                  "Kategorie muss eine Liste sein."
              )
          else:
              if not categories:
                  errors.append(
                      "Mindestens eine Kategorie ist erforderlich."
                  )

              invalid = [
                  category
                  for category in categories
                  if category not in allowed_categories
              ]

              if invalid:
                  errors.append(
                      "Ungültige Kategorie: "
                      + ", ".join(invalid)
                  )

          # Status
          allowed_statuses = {
              "initiative",
              "gesetzentwurf",
              "gesetz"
          }

          if new_entry.get("status") not in allowed_statuses:
              errors.append(
                  "Ungültiger Status."
              )

          # Links
          if not isinstance(
              new_entry.get("links"),
              list
          ):
              errors.append(
                  "Links muss eine Liste sein."
              )

          # Tags
          if not isinstance(
              new_entry.get("tags"),
              list
          ):
              errors.append(
                  "Tags muss eine Liste sein."
              )

          # Abbrechen, wenn Fehler gefunden wurden
          if errors:
              print("Validierung fehlgeschlagen:")

              for error in errors:
                  print(f"- {error}")

              sys.exit(1)

          # Neuen Eintrag hinzufügen
          projects.append(new_entry)

          # Gesamte Datei erneut als JSON serialisieren.
          # Dadurch wird sichergestellt, dass das Ergebnis
          # gültiges JSON bleibt.
          with open(path, "w", encoding="utf-8") as f:
              json.dump(
                  projects,
                  f,
                  ensure_ascii=False,
                  indent=2
              )
              f.write("\n")

          print(
              f"Eintrag '{new_id}' wurde erfolgreich "
              "validiert und zu projekte.json hinzugefügt."
          )
          PY

      - name: Branch erstellen und Änderungen committen
        id: branch
        run: |
          BRANCH="add-issue-${{ github.event.issue.number }}-${{ github.run_id }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"

          git add projekte.json

          git commit \
            -m "Add entry from issue #${{ github.event.issue.number }}"

          git push origin "$BRANCH"

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Pull Request erstellen
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_URL=$(gh pr create \
            --title "Eintrag aus Issue #${{ github.event.issue.number }}" \
            --body "Automatisch erzeugt aus #${{ github.event.issue.number }}." \
            --base main \
            --head "${{ steps.branch.outputs.branch }}")

          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Pull Request automatisch mergen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge \
            "${{ steps.pr.outputs.url }}" \
            --merge \
            --delete-branch

      - name: Issue als übernommen markieren
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue edit \
            "${{ github.event.issue.number }}" \
            --remove-label "bereit-zur-uebernahme" \
            --add-label "übernommen"

          gh issue comment \
            "${{ github.event.issue.number }}" \
            --body "✅ Der Eintrag wurde erfolgreich validiert und automatisch in \`projekte.json\` übernommen."
