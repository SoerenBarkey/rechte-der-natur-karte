<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rechte der Natur – Initiativen & Projekte</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green-deep: #0d3b2e;
      --green-mid: #1a5c45;
      --green-light: #2d8a63;
      --green-pale: #e8f5ee;
      --earth: #7a5c3a;
      --water: #1d6fa4;
      --water-light: #e6f2fa;
      --sand: #f5f0e8;
      --text: #1a2e25;
      --text-muted: #5a7060;
      --border: rgba(26,94,69,0.15);
      --shadow: 0 4px 24px rgba(13,59,46,0.10);
    }

    html, body { height: 100%; font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; background: var(--sand); color: var(--text); }

    /* FILTERS */
    .filter-bar {
      display: flex;
      gap: 8px;
      padding: 1rem 2rem 0.8rem;
      flex-wrap: wrap;
      align-items: center;
      background: white;
      border-bottom: 1px solid var(--border);
    }
    .filter-label { font-size: 0.75rem; color: var(--text-muted); font-weight: 500; text-transform: uppercase; letter-spacing: 0.07em; margin-right: 4px; }
    .filter-btn {
      padding: 4px 12px;
      border-radius: 20px;
      border: 1.5px solid var(--border);
      background: var(--sand);
      font-family: inherit;
      font-size: 0.8rem;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s;
    }
    .filter-btn:hover { border-color: var(--green-light); color: var(--green-mid); }
    .filter-btn.active { background: var(--green-deep); color: white; border-color: var(--green-deep); font-weight: 500; }

    /* LAYOUT */
    .main-layout {
      display: grid;
      grid-template-columns: 1fr 340px;
      height: calc(100vh - 58px);
      min-height: 480px;
    }

    #map { width: 100%; height: 100%; z-index: 1; border-right: 1px solid var(--border); }

    /* SIDEBAR */
    .sidebar { overflow-y: auto; background: white; display: flex; flex-direction: column; }
    .sidebar-header {
      padding: 1rem 1.25rem 0.75rem;
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; background: white; z-index: 10;
    }
    .sidebar-header h2 { font-family: Georgia, serif; font-size: 1rem; font-weight: 600; color: var(--text); }
    .sidebar-header p { font-size: 0.78rem; color: var(--text-muted); margin-top: 2px; }

    .project-list { flex: 1; padding: 0.75rem; display: flex; flex-direction: column; gap: 8px; }

    .project-card {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.9rem 1rem;
      cursor: pointer;
      transition: all 0.15s;
      background: white;
    }
    .project-card:hover { border-color: var(--green-light); box-shadow: 0 2px 12px rgba(26,92,69,0.1); transform: translateY(-1px); }
    .project-card.active { border-color: var(--green-mid); background: var(--green-pale); box-shadow: 0 2px 16px rgba(26,92,69,0.14); }

    .card-name { font-size: 0.9rem; font-weight: 500; color: var(--text); line-height: 1.3; margin-bottom: 6px; }
    .card-desc { font-size: 0.82rem; color: var(--text-muted); line-height: 1.6; margin-bottom: 6px; }

    .card-cats { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
    .cat-label {
      font-size: 0.68rem;
      font-weight: 500;
      padding: 2px 8px;
      border-radius: 10px;
      background: var(--green-pale);
      color: var(--green-mid);
      border: 1px solid rgba(26,94,69,0.2);
      display: inline-block;
      white-space: nowrap;
    }

    /* POPUP */
    .leaflet-popup-content-wrapper {
      border-radius: 12px !important;
      box-shadow: var(--shadow) !important;
      border: 1px solid var(--border) !important;
      padding: 0 !important;
    }
    .leaflet-popup-content { margin: 0 !important; min-width: 220px; max-width: 280px; }
    .popup-inner { padding: 14px 16px; }
    .popup-name { font-family: Georgia, serif; font-size: 1rem; font-weight: 600; color: var(--text); margin-bottom: 4px; line-height: 1.3; }
    .popup-cat { font-size: 0.72rem; color: var(--green-mid); font-weight: 500; margin-bottom: 8px; }
    .popup-desc { font-size: 0.8rem; color: var(--text-muted); line-height: 1.6; margin-bottom: 4px; }
    .popup-links { display: flex; flex-direction: column; }
    .popup-link {
      display: block; text-align: center;
      background: var(--green-deep); color: white;
      font-size: 0.8rem; font-weight: 500; padding: 7px 12px;
      text-decoration: none; transition: background 0.15s;
      border-top: 1px solid rgba(255,255,255,0.12);
    }
    .popup-link:last-child { border-radius: 0 0 10px 10px; }
    .popup-link:hover { background: var(--green-mid); }

    .card-links { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .card-link {
      font-size: 0.78rem; color: var(--water); text-decoration: none;
      display: inline-flex; align-items: center; gap: 3px; font-weight: 500;
      border: 1px solid var(--water); border-radius: 6px; padding: 2px 8px;
      transition: all 0.15s;
    }
    .card-link:hover { background: var(--water-light); }


    /* MARKER CLUSTER */
    .marker-cluster-small,
    .marker-cluster-medium,
    .marker-cluster-large { background-color: rgba(26,92,69,0.2); }
    .marker-cluster-small div,
    .marker-cluster-medium div,
    .marker-cluster-large div {
      background-color: #1a5c45;
      color: white;
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .empty-state { padding: 2rem; text-align: center; color: var(--text-muted); font-size: 0.85rem; }

    @media (max-width: 700px) {
      .main-layout { grid-template-columns: 1fr; grid-template-rows: 50vh 1fr; height: auto; }
      .sidebar { max-height: 50vh; }
      .filter-bar { padding: 0.7rem 1rem; }
    }
  </style>
</head>
<body>

<!-- Filter-Buttons werden per JavaScript generiert -->
<div class="filter-bar">
  <span class="filter-label">Filtern:</span>
  <button class="filter-btn active" data-filter="alle">Alle</button>
  <div id="filter-buttons" style="display:contents;"></div>
</div>

<div class="main-layout">
  <div id="map"></div>
  <aside class="sidebar">
    <div class="sidebar-header">
      <h2>Einträge</h2>
      <p id="sidebar-count">Alle Einträge</p>
    </div>
    <div class="project-list" id="project-list"></div>
  </aside>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>

// =====================================================
// EINZIGE QUELLE FÜR KATEGORIEN
// Hier pflegst du Kategorien – Buttons und Labels
// werden automatisch daraus generiert.
// =====================================================
const KATEGORIE_LABELS = {
  fluss:         'Flüsse',
  wald:          'Wald',
  meer:          'Meere & Seen',
  gesetzentwurf: 'Gesetzentwürfe',
  kunst:         'Kunst & Kultur',
  vereine:       'Vereine, Stiftungen & NGOs',
  wissenschaft:  'Wissenschaft',
  recht:         'Rechtsexpert:innen',
  zivil:         'Zivilgesellschaft',
};

function katLabel(kategorie) {
  const cats = Array.isArray(kategorie) ? kategorie : [kategorie];
  return cats.map(c => KATEGORIE_LABELS[c] || c).join(' · ');
}

// =====================================================
// FILTER-BUTTONS GENERIEREN
// =====================================================
function renderFilterButtons() {
  const container = document.getElementById('filter-buttons');
  container.innerHTML = Object.entries(KATEGORIE_LABELS).map(([key, label]) =>
    `<button class="filter-btn" data-filter="${key}">${label}</button>`
  ).join('');

  // Alle Buttons (inkl. "Alle") mit Event-Listener versehen
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeFilter = btn.dataset.filter;
      activeCard = null;
      render();
    });
  });
}

// =====================================================
// MARKER
// =====================================================
function makeIcon(selected = false) {
  const color = '#1a5c45';
  const size = selected ? 36 : 28;
  const r = selected ? 10 : 7;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size+10}" viewBox="0 0 ${size} ${size+10}">
    <circle cx="${size/2}" cy="${size/2}" r="${size/2-2}" fill="${color}" fill-opacity="0.18"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="${color}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r*0.45}" fill="white"/>
    <line x1="${size/2}" y1="${size/2+r}" x2="${size/2}" y2="${size+6}" stroke="${color}" stroke-width="2" stroke-linecap="round"/>
  </svg>`;
  return L.divIcon({ html: svg, className: '', iconSize: [size, size+10], iconAnchor: [size/2, size+8], popupAnchor: [0, -(size+6)] });
}

// =====================================================
// KARTE
// =====================================================
const map = L.map("map", { zoomControl: true, scrollWheelZoom: true, maxZoom: 18 }).setView([51.5, 10.0], 5);
let clusterGroup = L.markerClusterGroup({ 
  showCoverageOnHover: false,
  maxClusterRadius: 20
}).addTo(map);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  maxZoom: 18
}).addTo(map);

// =====================================================
// STATE
// =====================================================
let allProjekte = [];
let markers = {};
let activeCard = null;
let activeFilter = 'alle';

// =====================================================
// DATEN LADEN
// =====================================================
async function loadData() {
  try {
    const res = await fetch('projekte.json');
    allProjekte = await res.json();
  } catch(e) {
    console.warn('projekte.json nicht gefunden, lade Beispieldaten.');
    allProjekte = BEISPIELDATEN;
  }
  renderFilterButtons();
  render();
}

// =====================================================
// RENDER
// =====================================================
function render() {
  clusterGroup.clearLayers();
  markers = {};

  const visible = activeFilter === 'alle'
    ? allProjekte
    : allProjekte.filter(p =>
        Array.isArray(p.kategorie)
          ? p.kategorie.includes(activeFilter)
          : p.kategorie === activeFilter
      );

  const list = document.getElementById('project-list');
  list.innerHTML = '';
  document.getElementById('sidebar-count').textContent =
    `${visible.length} Eintrag${visible.length !== 1 ? 'e' : ''}`;

  if (visible.length === 0) {
    list.innerHTML = '<div class="empty-state">Keine Einträge in dieser Kategorie.</div>';
    return;
  }

  visible.forEach(p => {
    const marker = L.marker([p.lat, p.lng], { icon: makeIcon(false) });
    clusterGroup.addLayer(marker);
    const linkItems = p.links?.length
      ? p.links
      : (p.url && p.url !== '#' ? [{ label: 'Mehr erfahren', url: p.url }] : []);
    const linksHtml = linkItems.length
      ? `<div class="popup-links">${linkItems.map(l =>
          `<a href="${l.url}" target="_blank" rel="noopener" class="popup-link">${l.label} →</a>`
        ).join('')}</div>`
      : '';

    marker.bindPopup(`
      <div class="popup-inner">
        <div class="popup-name">${p.name}</div>
        <div class="popup-cat">${katLabel(p.kategorie)}</div>
        <div class="popup-desc">${p.beschreibung}</div>
      </div>${linksHtml}`, { maxWidth: 300 });

    marker.on('click', () => activateCard(p.id));
    markers[p.id] = marker;

    const card = document.createElement('div');
    card.className = 'project-card';
    card.id = `card-${p.id}`;
    card.innerHTML = `
      <div class="card-name">${p.name}</div>
      <div class="card-desc">${p.beschreibung}</div>
      ${linkItems.length ? `<div class="card-links">${linkItems.map(l =>
        `<a href="${l.url}" target="_blank" rel="noopener" class="card-link">${l.label} ↗</a>`
      ).join('')}</div>` : ''}
      <div class="card-cats">
        ${(Array.isArray(p.kategorie) ? p.kategorie : [p.kategorie])
          .map(c => `<span class="cat-label">${KATEGORIE_LABELS[c] || c}</span>`)
          .join('')}
      </div>`;
    card.addEventListener('click', () => activateCard(p.id));
    list.appendChild(card);
  });
}

function activateCard(id) {
  if (activeCard) {
    if (markers[activeCard]) markers[activeCard].setIcon(makeIcon(false));
    const prevEl = document.getElementById(`card-${activeCard}`);
    if (prevEl) prevEl.classList.remove('active');
  }
  activeCard = id;
  const p = allProjekte.find(p => p.id === id);
  if (!p) return;
  if (markers[id]) {
    markers[id].setIcon(makeIcon(true));
    markers[id].openPopup();
    map.setView([p.lat, p.lng], Math.max(map.getZoom(), 8), { animate: true });
  }
  const cardEl = document.getElementById(`card-${id}`);
  if (cardEl) {
    cardEl.classList.add('active');
    cardEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
}

// =====================================================
// BEISPIELDATEN
// =====================================================
const BEISPIELDATEN = [
  {
    id: "spree", name: "Spree", lat: 52.52, lng: 13.405,
    kategorie: "fluss", land: "Deutschland",
    beschreibung: "Petition zur Anerkennung der Spree als Rechtssubjekt in Berlin.",
    links: [{ label: "Petition", url: "https://weact.campact.de/petitions/rechte-der-spree-anerkennen" }]
  }
];

loadData();
</script>
</body>
</html>
